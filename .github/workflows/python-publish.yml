name: Publish Python Package

on:
  push:
    branches:
      - main  # Публикуем на каждый пуш в main (или другой основной ветке)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'  # Установить нужную версию Python

    - name: Install system dependencies for SciPy
      run: |
        sudo apt-get update
        sudo apt-get install -y libjpeg-dev libopenblas-dev liblapack-dev gfortran pkg-config libxsimd-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build  # Устанавливаем build для сборки пакета
        pip install -r requirements.txt  # Устанавливаем зависимости из requirements.txt

    - name: Build the package
      run: |
        python -m build  # Сборка пакета с использованием pyproject.toml

    - name: Publish to PyPI
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Публикуем на пуш в main
      uses: pypa/gh-action-pypi-publish@v1.4.0  # GitHub Action для публикации на PyPI
      with:
        user: ${{ secrets.PYPI_USERNAME }}  # Имя пользователя PyPI (из GitHub Secrets)
        password: ${{ secrets.PYPI_PASSWORD }}  # Пароль на PyPI (из GitHub Secrets)